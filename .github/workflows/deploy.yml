name: Deploy to Render

on:
  push:
    branches:
      - main  # Trigger action when there's a push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Render CLI
        run: |
          curl -sSL https://render.com/downloads/render-cli.sh | bash
          sudo mv render /usr/local/bin/

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}  # Use the secret here
        run: |
          render deploy --api-key $RENDER_API_KEY  # Example command, modify according to your setup
