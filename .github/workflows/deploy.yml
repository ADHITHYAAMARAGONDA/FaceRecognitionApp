name: Build and Deploy AI Face Recognition App

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main  # or change to the branch you prefer

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Add your Docker Hub username in GitHub Secrets
        password: ${{ secrets.DOCKER_PASSWORD }}  # Add your Docker Hub password in GitHub Secrets

    # Build the Docker image
    - name: Build Docker image
      run: docker build -t adhithya143/ai-face-recognition:latest .

    # Push the Docker image to Docker Hub
    - name: Push Docker image to Docker Hub
      run: docker push adhithya143/ai-face-recognition:latest

    # (Optional) If you're deploying the app to Render or another platform
    - name: Deploy to Render (or other cloud provider)
      run: |
        curl -fsSL https://cdn.render.com/install.sh | sh  # This installs the Render CLI
        render login --api-key ${{ secrets.RENDER_API_KEY }}  # Use your Render API key from GitHub secrets
        render deploy --service-id your-service-id  # Replace `your-service-id` with your actual service ID
